<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3286ff"/>
      <stop offset="1" stop-color="#1551e0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c66f5"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0b1b34" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="120" cy="120" r="280" fill="#bcdeff" opacity="0.35"/>
  <circle cx="1080" cy="560" r="320" fill="#0ea5a4" opacity="0.10"/>

  <!-- Logo mark -->
  <g transform="translate(90, 84)">
    <rect width="88" height="88" rx="22" fill="url(#logo)"/>
    <path d="M18 50h14l5-12 8 26 7-36 7 22h14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="40" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0b1b34">Дом<tspan fill="#1c66f5"> Доктор</tspan></text>
    <text x="108" y="70" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#475569" letter-spacing="3">МЕДТЕХНИКА ДЛЯ ДОМА</text>
  </g>

  <!-- Headline -->
  <text x="90" y="320" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#0b1b34">Медицинская техника</text>
  <text x="90" y="398" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="url(#accent)">и товары для здоровья</text>

  <!-- Sub -->
  <text x="92" y="460" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#475569">Тонометры · Ингаляторы · Глюкометры · Ортопедия · Реабилитация</text>

  <!-- Pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(90, 510)">
      <rect width="240" height="46" rx="23" fill="#1c66f5"/>
      <text x="120" y="30" text-anchor="middle" fill="#fff">Доставка по Казахстану 🇰🇿</text>
    </g>
    <g transform="translate(346, 510)">
      <rect width="200" height="46" rx="23" fill="#ffffff" stroke="#d9ecff" stroke-width="1"/>
      <text x="100" y="30" text-anchor="middle" fill="#1551e0">Гарантия и качество</text>
    </g>
    <g transform="translate(562, 510)">
      <rect width="180" height="46" rx="23" fill="#ffffff" stroke="#d9ecff" stroke-width="1"/>
      <text x="90" y="30" text-anchor="middle" fill="#1551e0">Консультация</text>
    </g>
  </g>
</svg>
